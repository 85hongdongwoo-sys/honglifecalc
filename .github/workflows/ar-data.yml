name: Argentina BCRA data (UVA, ICL, IPC)
on:
  workflow_dispatch:
  schedule:
    - cron: '41 12 * * *'   # 09:41 Buenos Aires — BCRA has published the day's UVA/ICL
permissions:
  contents: write
  actions: write
jobs:
  ar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: build}
      - run: python3 build/ar/fetch_bcra.py out
      - name: Publish to data-ar branch and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          git init -q -b data-ar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "BCRA $(date +%F)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data-ar
          gh workflow run pages.yml --ref main -R "$GITHUB_REPOSITORY" || true
