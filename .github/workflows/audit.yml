name: Site audit (전체 검수)
on:
  workflow_dispatch:
    inputs:
      sample:
        description: "휴대폰 화면 검사할 표본 페이지 수"
        default: "700"
permissions:
  contents: write
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 최근 배포본 받기
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          RID=$(gh api "repos/${{ github.repository }}/actions/workflows/pages.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id')
          echo "run $RID"
          gh run download $RID -n github-pages -D art
          mkdir -p _site && tar -xf art/artifact.tar -C _site
          find _site -name '*.html' | wc -l
      - name: 정적 검수 (제목·설명·링크·오류 글자·연도·언어)
        run: python3 build/audit/audit_static.py _site report
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: 휴대폰 화면 검수 (표본)
        run: |
          npm i --no-save playwright@1.47.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 build/audit/pick_sample.py _site ${{ github.event.inputs.sample || 700 }} > report/sample.txt
          (cd _site && python3 -m http.server 8080 >/dev/null 2>&1 &)
          sleep 2
          node build/audit/audit_visual.js report/sample.txt http://localhost:8080 report/visual.json
      - name: 보고서 저장 (data-audit 브랜치)
        run: |
          cd report
          git init -q && git checkout -q -b data-audit
          git config user.name "audit-bot" && git config user.email "audit-bot@users.noreply.github.com"
          git add -A && git commit -qm "audit $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data-audit
