name: Italy fuel prices (MIMIT Osservaprezzi)
on:
  workflow_dispatch:
  # schedule paused: mimit.gov.it does not answer GitHub-hosted runners (timeouts, 2026-11-24)
permissions:
  contents: write
jobs:
  it:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: build}
      - run: python3 build/it/fetch_carburanti.py out
      - name: Publish to data-it branch (pages read it via raw.githubusercontent.com)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          git init -q -b data-it
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "MIMIT $(date -u +%F)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data-it
