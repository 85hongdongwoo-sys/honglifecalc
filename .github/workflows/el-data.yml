name: Electricity day-ahead prices (Energi Data Service)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'    # every 3 h (next-day prices appear ~12:45–13:00 CET)
    - cron: '7 12 * * *'
    - cron: '37 12 * * *'
permissions:
  contents: write
jobs:
  el:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: build}
      - run: python3 build/el/fetch_eds.py out
      - name: Publish to data-el branch (pages read it via raw.githubusercontent.com)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          git init -q -b data-el
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "EDS $(date -u +%FT%H:%M)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data-el
