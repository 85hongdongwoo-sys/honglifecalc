name: People pages data (Wikidata)
on:
  workflow_dispatch:
    inputs:
      add:
        description: 'New people to add this run'
        default: '100'
  schedule:
    - cron: '17 4 * * *'   # daily: +100 people (US first), ages roll over before the morning
permissions:
  contents: write
  actions: write
jobs:
  people:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: build}
      - name: Load published state (data-people branch)
        run: |
          mkdir -p out
          if git fetch -q --depth 1 origin data-people; then git archive FETCH_HEAD | tar -x -C out; fi
          ls -la out/people-data || true
      - name: Candidates (US, weekly — the people Americans read about most)
        run: |
          f=out/people-data/candidates-US.json
          if [ ! -f "$f" ] || [ "$(date +%u)" = "1" ]; then python3 build/people/candidates.py US enwiki en out; fi
      - name: Fetch facts (+ new people)
        env:
          ADD_PER_DAY: ${{ github.event.inputs.add || '100' }}
        run: python3 build/people/fetch_people.py out
      - name: Publish to data-people branch and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          git init -q -b data-people
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "people $(date +%F)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data-people
          gh workflow run pages.yml --ref main -R "$GITHUB_REPOSITORY" || true
