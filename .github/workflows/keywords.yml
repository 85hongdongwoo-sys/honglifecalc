name: 검색어 조사 (대기 페이지 자동완성)
on:
  workflow_dispatch:
    inputs:
      max:
        description: '최대 페이지 수'
        default: '100000'
permissions:
  contents: write
  actions: read
jobs:
  kw:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: 지금 배포된 사이트 받기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=github-pages&per_page=30" --jq '[.artifacts[]|select(.expired|not)]|sort_by(.created_at)|last|.id')
          gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > a.zip
          unzip -q a.zip && mkdir -p _site && tar -xf artifact.tar -C _site && rm -f a.zip artifact.tar
      - run: python3 build/kw/suggest.py _site kw-out ${{ github.event.inputs.max }}
      - name: data-kw 브랜치에 저장
        if: always()
        run: |
          cd kw-out
          git init -q && git checkout -q -b data-kw
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add kw.json && git commit -qm "keywords $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data-kw
