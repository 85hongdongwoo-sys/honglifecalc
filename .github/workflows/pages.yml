name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack site
        run: |
          mkdir -p _site
          cat pkg/site.tar.gz.part* | tar -xzf - -C _site
          if ls ogpkg/og.tar.gz.part* >/dev/null 2>&1; then cat ogpkg/og.tar.gz.part* | tar -xzf - -C _site; fi
          echo "files: $(find _site -type f | wc -l)"
          if [ -d overlay ]; then cp -r overlay/. _site/; echo "overlay: $(find overlay -type f | wc -l)"; fi
      - name: Add hreflang cluster for country hubs
        run: python3 build/patch_hreflang.py _site
      - name: Trim sitemaps (Korean pages with no Google impressions)
        run: python3 build/patch_sitemap.py _site
      - name: Spread related links evenly (nearest siblings ring)
        run: python3 build/patch_related.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
