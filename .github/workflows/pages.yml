name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack site
        run: |
          mkdir -p _site
          cat pkg/site.tar.gz.part* | tar -xzf - -C _site
          if ls ogpkg/og.tar.gz.part* >/dev/null 2>&1; then cat ogpkg/og.tar.gz.part* | tar -xzf - -C _site; fi
          echo "files: $(find _site -type f | wc -l)"
          if [ -d overlay ]; then cp -r overlay/. _site/; echo "overlay: $(find overlay -type f | wc -l)"; fi
      - name: EV charger data (data-ev branch)
        continue-on-error: true
        run: |
          git fetch -q --depth 1 origin data-ev && git archive FETCH_HEAD ev | tar -x -C _site && echo "ev: $(find _site/ev -type f | wc -l)"
      - name: FX data + currency converter pages (data-fx branch)
        continue-on-error: true
        run: |
          git fetch -q --depth 1 origin data-fx && git archive FETCH_HEAD fx | tar -x -C _site && python3 build/fx/gen_fx_pages.py _site
      - name: Quake & aurora pages (data-geo branch)
        continue-on-error: true
        run: |
          git fetch -q --depth 1 origin data-geo && git archive FETCH_HEAD geo | tar -x -C _site
          python3 build/geo/gen_quake.py _site || true
          [ -f build/geo/gen_aurora.py ] && python3 build/geo/gen_aurora.py _site || true
      - name: Korean hub (square tiles + collapsible list)
        continue-on-error: true
        run: python3 build/patch_ko_hub.py _site
      - name: New pages (sitemap + hub links)
        run: python3 build/patch_newpages.py _site
      - name: Add hreflang cluster for country hubs
        run: python3 build/patch_hreflang.py _site
      - name: Noindex pages with no Google impressions (build/noindex_list.txt)
        run: python3 build/patch_noindex.py _site
      - name: Trim sitemaps (Korean pages with no Google impressions)
        run: python3 build/patch_sitemap.py _site
      - name: Spread related links evenly (nearest siblings ring)
        run: python3 build/patch_related.py _site
      - name: Freshness (sitemap lastmod + dateModified)
        run: python3 build/patch_datemod.py _site https://honglifecalc.com
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
