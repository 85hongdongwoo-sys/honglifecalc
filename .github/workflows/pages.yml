name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack site
        run: |
          mkdir -p _site
          cat pkg/site.tar.gz.part* | tar -xzf - -C _site
          if ls ogpkg/og.tar.gz.part* >/dev/null 2>&1; then cat ogpkg/og.tar.gz.part* | tar -xzf - -C _site; fi
          echo "files: $(find _site -type f | wc -l)"
          if [ -d overlay ]; then cp -r overlay/. _site/; echo "overlay: $(find overlay -type f | wc -l)"; fi
      - name: EV charger data (data-ev branch)
        continue-on-error: true
        run: |
          git fetch -q --depth 1 origin data-ev && git archive FETCH_HEAD ev | tar -x -C _site && echo "ev: $(find _site/ev -type f | wc -l)"
      - name: FX data + currency converter pages (data-fx branch)
        continue-on-error: true
        run: |
          git fetch -q --depth 1 origin data-fx && git archive FETCH_HEAD | tar -x -C _site && python3 build/fx/gen_fx_pages.py _site && ( [ -f build/fx/gen_holidays.py ] && python3 build/fx/gen_holidays.py _site || true )
      - name: Argentina BCRA pages (data-ar branch) — UVA hoy, ICL hoy, inflación
        continue-on-error: true
        run: |
          git fetch -q --depth 1 origin data-ar && git archive FETCH_HEAD | tar -x -C _site && python3 build/ar/gen_ar_pages.py _site
      - name: People pages (data-people branch) — Famosos en números
        continue-on-error: true
        run: |
          git fetch -q --depth 1 origin data-people && git archive FETCH_HEAD | tar -x -C _site && python3 build/people/gen_people.py _site
      - name: Quake & aurora pages (data-geo branch)
        continue-on-error: true
        run: |
          git fetch -q --depth 1 origin data-geo && git archive FETCH_HEAD geo | tar -x -C _site
          python3 build/geo/gen_quake.py _site || true
          [ -f build/geo/gen_aurora.py ] && python3 build/geo/gen_aurora.py _site || true
      - name: Korean inner pages (Apple HIG style)
        continue-on-error: true
        run: python3 build/patch_hig.py _site
      - name: Korean hub (square tiles + collapsible list)
        continue-on-error: true
        run: python3 build/patch_ko_hub.py _site
      - name: Korean hub banner (season slide)
        continue-on-error: true
        run: python3 build/patch_ko_flash.py _site
      - name: Top bar (favorites, app install) + readable text on dark backgrounds — all languages
        continue-on-error: true
        run: python3 build/patch_topbar.py _site
      - name: New pages (sitemap + hub links)
        run: python3 build/patch_newpages.py _site
      - name: Korean space pages (science tile + science list)
        continue-on-error: true
        run: python3 build/patch_ko_space.py _site
      - name: Answer-first titles for page-1 pages with no clicks
        run: python3 build/patch_titles.py _site
      - name: Deepen top pages (TOC, tables, examples, FAQ)
        run: python3 build/patch_deep.py _site
      - name: Add hreflang cluster for country hubs
        run: python3 build/patch_hreflang.py _site
      # Noindex step paused 2026-11-22: the list was built from the Search Console top-1,000 rows (row cap), so it may include pages that did get impressions.
      # - name: Noindex pages with no Google impressions (build/noindex_list.txt)
      #   run: python3 build/patch_noindex.py _site
      - name: Trim sitemaps (Korean pages with no Google impressions)
        run: python3 build/patch_sitemap.py _site
      - name: Spread related links evenly (nearest siblings ring)
        run: python3 build/patch_related.py _site
      - name: Per-calculator apps (manifest per page)
        run: python3 build/patch_pwa.py _site
      - name: Freshness (sitemap lastmod + dateModified)
        run: python3 build/patch_datemod.py _site https://honglifecalc.com
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Wait until the uploaded artifact is registered
        run: sleep 45
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
