name: EV charger data (official registries)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 20 * * 3'   # 매주 목요일 05:17 KST
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: build}
      - name: Fetch and tile
        run: python3 build/ev/fetch_ev.py out de fr
      - name: Publish to data-ev branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          git init -q -b data-ev
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "EV data $(date +%F)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data-ev
          gh workflow run pages.yml --ref main -R "$GITHUB_REPOSITORY" || true
